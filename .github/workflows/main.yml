name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - run: npm ci
    
    - name: Run ESLint
      run: npm run lint
      
    - name: Run Typecheck
      run: npx tsc --noEmit
      
    - name: Build Next.js
      run: npm run build
      env:
        # Provide dummy env vars if build requires them
        GEMINI_API_KEY: "dummy"
        NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
        DATABASE_URL: "postgresql://dummy"
        DIRECT_URL: "postgresql://dummy"
